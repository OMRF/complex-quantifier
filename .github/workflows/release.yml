name: Release
on:
    push:
        tags:
            - 'v*.*.*'

jobs:
    release:
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                platform:
                  - os: windows-latest
                    rust_target: x86_64-pc-windows-msvc
                  - os: windows-latest
                    rust_target: aarch64-pc-windows-msvc
                  - os: macos-latest
                    rust_target: x86_64-apple-darwin
                  - os: macos-latest
                    rust_target: aarch64-apple-darwin
                  - os: ubuntu-latest
                    rust_target: x86_64-unknown-linux-gnu
                  - os: ubuntu-latest
                    rust_target: aarch64-unknown-linux-gnu

        runs-on: ${{ matrix.platform.os }}
        steps:
            - uses: actions/checkout@v3
            - name: Bump version
              shell: bash
              id: bump_version
              env:
                REF: ${{ github.ref }}
              run: |
                if [[ "$RUNNER_OS" == "macOS" ]]; then
                  sed -i '.bak' 's/"version": "0.0.0"/"version": "'"${REF:11}"'"/' src-tauri/tauri.conf.json && rm src-tauri/tauri.conf.json.bak
                else
                  sed -i'' 's/"version": "0.0.0"/"version": "'"${REF:11}"'"/' src-tauri/tauri.conf.json
                fi
                echo "version_name=${REF:10}" >> $GITHUB_OUTPUT
            - name: setup node
              uses: actions/setup-node@v3
              with:
                  node-version: 20
            - name: install Rust stable
              uses: dtolnay/rust-toolchain@stable
            - name: Rustup add target
              run: rustup target add ${{ matrix.platform.rust_target }}
            - name: install dependencies (ubuntu only)
              if: matrix.platform.os == 'ubuntu-latest'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf libgdk-3-dev
            - name: install frontend dependencies
              run: npm install
            - uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tagName: ${{ github.ref }}
                  releaseName: ${{ steps.bump_version.outputs.version_name }}
                  releaseDraft: true
                  prerelease: false
